
# Disable the default automatic build phase
build: off

environment:

  matrix:
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2026
      PYTHON: "C:\\Python312-x64"

    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2404
      PYTHON: "$HOME/venv3.12"

    - APPVEYOR_BUILD_WORKER_IMAGE: macos-sonoma
      PYTHON: "~/venv3.12"

install:
  - cmd: echo "     ** windows build **"
  - sh: if [[ $(uname -s) == Linux ]]; then echo "     ** linux build **"; fi
  - sh: if [[ $(uname -s) == Darwin ]]; then echo "     ** macos build **"; fi

  - cmd: set PATH=%PYTHON%;%PYTHON%\\Scripts;%PATH%
  - sh: export PATH=~/venv3.12/bin:~/venv3.12/lib:$PATH

  - python --version
  - python -m pip install --upgrade pip
  - python -m pip install "six>=1.13"
  - python -m pip install pytest
  - python -m pip install .

  - sh: if [[ $(uname -s) == Linux ]]; then python -m pip install coverage; fi
    
test_script:
  - cmd: python -m soma_workflow.test -v
  - sh: if [[ $(uname -s) == Darwin ]]; then python -m soma_workflow.test -v; fi
  - sh: if [[ $(uname -s) == Linux ]]; then coverage run --source=soma_workflow -m pytest -v; fi
  - sh: if [[ $(uname -s) == Linux ]]; then coverage xml -i; fi

after_test:
  - sh: if [[ $(uname -s) == Linux ]]; then curl -Os https://uploader.codecov.io/latest/linux/codecov; fi
  - sh: if [[ $(uname -s) == Linux ]]; then chmod +x codecov; fi
  - sh: if [[ $(uname -s) == Linux ]]; then ./codecov -f "coverage.xml" -t "a3d6bf97-19d7-4bfe-b8d4-1196b5925682"; fi

notifications:
  - provider: Email
    to:
      - '{{commitAuthorEmail}}'
    on_build_failure: true
    on_build_success: false
    on_build_status_changed: true
